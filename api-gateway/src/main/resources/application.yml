server:
  port: 8080 # El puerto donde escuchará el API Gateway

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Configuración global de CORS para que React pueda comunicarse sin errores
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173" # Puerto por defecto de Vite (React)
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      
      # Definición de las rutas hacia tus microservicios
      routes:
        - id: ms-usuarios
          # Si estás usando Docker, asegurate de que el nombre coincida con el service en docker-compose
          uri: http://localhost:8081 
          predicates:
            # Ahora coincide con http://localhost:8080/usuarios/...
            - Path=/usuarios/**
          filters:
            # Quita "/usuarios" para que al MS le llegue solo "/api/pacientes/registro"
            - StripPrefix=1