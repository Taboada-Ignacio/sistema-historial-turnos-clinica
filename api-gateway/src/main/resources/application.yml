server:
  port: 8080 # Puerto de entrada principal para React y Postman

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # CORS único (sin CorsWebFilter duplicado). Origen del front Vite vía APP_GATEWAY_CORS_ALLOWED_ORIGIN.
      # Con withCredentials: true en el front hace falta allowCredentials + origen explícito (no "*").
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "${APP_GATEWAY_CORS_ALLOWED_ORIGIN:http://localhost:5173}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-System-Key
              - x-system-key
              - Accept
              - Origin
              - X-Requested-With
            allowCredentials: true
            maxAge: 3600

      # Definición de las rutas hacia tus microservicios
      routes:
        # --- RUTA 1: Microservicio de Usuarios (APIs y Fotos de Perfil) ---
        - id: ms-usuarios
          # OJO: Si estás probando local sin levantar Docker Compose, cambia esto a http://localhost:8081 temporalmente
          uri: http://ms-usuarios:8081
          predicates:
            # Captura todas las peticiones que empiecen con /usuarios
            - Path=/usuarios/**
          filters:
            # Elimina la primera parte del path ("/usuarios") antes de enviar al microservicio
            # Ejemplo: /usuarios/api/pacientes/registro -> /api/pacientes/registro
            # Ejemplo 2: /usuarios/fotosPerfilProfesionales/foto.webp -> /fotosPerfilProfesionales/foto.webp
            - StripPrefix=1

        # --- RUTA 2: Documentación OpenAPI de ms-usuarios ---
        - id: openapi-usuarios
          uri: http://ms-usuarios:8081
          predicates:
            # El Gateway intercepta esta ruta específica que pide la interfaz de Swagger
            - Path=/v3/api-docs/ms-usuarios
          filters:
            # La reescribe para pedirle al microservicio su ruta real de documentación
            - RewritePath=/v3/api-docs/ms-usuarios, /v3/api-docs

# --- CONFIGURACIÓN DE SWAGGER AGREGADO EN EL GATEWAY ---
springdoc:
  swagger-ui:
    # Esta configuración arma el menú desplegable en la esquina superior derecha del Swagger del Gateway
    urls:
      - name: API Usuarios
        url: /v3/api-docs/ms-usuarios
